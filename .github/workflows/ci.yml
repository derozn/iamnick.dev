name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # pnpm 11 reads build-script approvals from pnpm-workspace.yaml (allowBuilds
      # since 11.x — the older onlyBuiltDependencies list errors); without it the
      # install fails on sharp (ERR_PNPM_IGNORED_BUILDS). The repo keeps
      # pnpm-workspace.yaml gitignored (Vercel's pnpm rejected a packages-less
      # workspace file), so we write a settings-only one here, just for CI.
      - name: Approve native builds (sharp)
        run: |
          printf 'allowBuilds:\n  sharp: true\n' > pnpm-workspace.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate env schema
        run: pnpm env:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:ci

      - name: Build
        run: pnpm build
